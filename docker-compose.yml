version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vuln-scanner-backend
    environment:
      # Generate a secure key: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-this-to-a-secure-random-key-before-deploying}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - ALLOWED_HOSTS=*
      - DB_ENGINE=django.db.backends.sqlite3
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - scanner-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vuln-scanner-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - scanner-net

volumes:
  backend_static:

networks:
  scanner-net:
    driver: bridge
